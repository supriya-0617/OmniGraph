# Render Blueprint for the OmniGraph API (https://render.com/docs/blueprint-spec).
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: omnigraph-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: ENVIRONMENT
        value: production
      - key: DEV_DEFAULT_ACCOUNT_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      - key: CORS_ORIGINS
        sync: false # e.g. https://omnigraph.vercel.app
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
