# Render Blueprint for the OmniGraph API (https://render.com/docs/blueprint-spec).
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: omnigraph-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: ENVIRONMENT
        value: production
      - key: DEV_DEFAULT_ACCOUNT_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: omnigraph
      - key: MONGODB_ACCOUNTS_COLLECTION
        value: accounts
      - key: MONGODB_SERVER_SELECTION_TIMEOUT_MS
        value: "5000"
      - key: CORS_ORIGINS
        sync: false # e.g. https://omnigraph.vercel.app
      - key: LLM_PROVIDER
        value: vertex
      - key: LLM_API_KEY
        sync: false # only for LLM_PROVIDER=gemini / openai / anthropic
      - key: LLM_MODEL
        sync: false
      - key: LLM_TIMEOUT_SECONDS
        value: "90"
      - key: VERTEX_PROJECT_ID
        sync: false # e.g. fullstackassignment-513909
      - key: VERTEX_LOCATION
        value: global
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false # Render secret file path, e.g. /etc/secrets/vertex-sa.json
